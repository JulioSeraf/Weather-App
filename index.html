<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style/reset.css">
  <link rel="stylesheet" href="style/style.css">
  <title>Frontend Mentor | Weather app</title>

</head>

<body>
  <header>
    <i><img src="assets/images/logo.svg" alt="logo"></i>
    <button class="units-buts" id="units-but">
      <img src="assets/images/icon-units.svg" alt="">
      <p>Units</p>
      <img src="assets/images/icon-dropdown.svg" alt="">
    </button>
    <nav id="nav-imp-met">
      <button>
        Switch to Imperial/Metric
      </button>
      <div>
        <p>Temperature</p>
        <button>Celsius (°C)</button>
        <button>Fahrenheit (°F)</button>
      </div>
      <div>
        <p> Wind Speed</p>
        <button>
          km/h
        </button>
        <button>
          mph
        </button>
      </div>
      <div>
        <p>Precipitation</p>
        <button>Millimeters (mm)</button>
        <button>Inches (in)</button>
      </div>
    </nav>
    <h1>
      How's the <br> sky looking <br> today?
    </h1>
  </header>
  <nav id="search-box">
    <form action="js/script.js">
      <input id="search-input" type="search" placeholder="Search for a place..." autocomplete="off">
      <div class="search-opt" id="search-opt">
      </div>
      <template id="search-citys">
        <button id=""></button>
      </template>
      <button id="search-but">Search</button>
    </form>
</nav>
  <main>
    <section id="painel-box">
      <div class="painel-info">
        <h3 id="painel-city"></h3>
        <p id="painel-week"></p>
        <div class="temp-info">
          <img id="painel-img" src="" alt="">
          <p id="painel-temp"></p>
        </div>
      </div>
      <img class="fundo-p" src="assets/images/bg-today-small.svg" alt="fundo imagem">
    </section>
    <section id="info-box">
      <div>
        <p>Feels Like</p>
        <p id="feels">00</p>
      </div>
      <div >
        <p>Humidity</p>
        <p id="humidity">00</p>
      </div>
      <div >
        <p>Wind</p>
        <p id="wind">00</p>
      </div>
      <div >
        <p>Precipitation</p>
        <p id="precipitation">00</p>
      </div>
    </section>
    <section id="daily-box">
      <h3>
        Daily forecast
      </h3>
      <div class="div-daily">
        <template id="daily-templete">
          <div class="week-days-info">
            <p id="sigla-semanal">
            </p>
            <img src="#" alt="#">
            <p class="day-max"></p>
            <p class="day-min"></p>
          </div>
        </template>
      </div>
    </section>
  </main>
  <aside>
    <h3>Hourly forecast</h3>
    <select id="hourly-select">
      <template id="opt-hourly">
        <option class="opts" value=""></option>
      </template>
    </select>
    <template id="hourly-templete">
      <div class="div-hourly">
        <img src="" alt="">
        <p id="hour-hourly"></p>
        <p id="temp-hourly"></p>
      </div>
    </template>

  </aside>
  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by <a href="https://github.com/JulioSeraf" target="_blank">Julio Serafim</a>.
  </footer></p>
    
   
  <script src="js/script.js"></script>
</body>

</html>
