<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style/reset.css">
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/desktop.css">
  <title>Frontend Mentor | Weather app</title>

</head>

<body>
  <header>
    <i><img src="assets/images/logo.svg" alt="logo"></i>
    <button class="units-buts" id="units-but">
      <img src="assets/images/icon-units.svg" alt="">
      <p>Units</p>
      <img src="assets/images/icon-dropdown.svg" alt="">
    </button>
    <nav id="nav-imp-met">
      <button>
        Switch to Imperial/Metric
      </button>
      <div>
        <p>Temperature</p>
        <button> <span>Celsius (°C)</span><i><img src="assets/images/icon-checkmark.svg"
              alt="icon-checkmark"></i></button>
        <button><span>Fahrenheit (°F)</span> <i><img src="assets/images/icon-checkmark.svg"
              alt="icon-checkmark"></i></button>
      </div>
      <div>
        <p> Wind Speed</p>
        <button>
          <span> km/h</span> <i><img src="assets/images/icon-checkmark.svg" alt="icon-checkmark"></i>
        </button>
        <button>
          <span> mph</span>
          <i><img src="assets/images/icon-checkmark.svg" alt="icon-checkmark"></i>
        </button>
      </div>
      <div>
        <p>Precipitation</p>
        <button><span>Millimeters (mm)</span> <i><img src="assets/images/icon-checkmark.svg" alt="icon-checkmark"></i>
        </button>

        <button><span>Inches (in)</span> <i><img src="assets/images/icon-checkmark.svg" alt="icon-checkmark"></i></button>
      </div>
    </nav>
    <h1>
      How's the sky looking today?
    </h1>
  </header>
  <nav id="search-box">
    <form action="js/script.js">
      <input id="search-input" type="search" placeholder="Search for a place..." autocomplete="off">
      <div class="search-opt" id="search-opt">
      </div>
      <template id="search-citys">
        <button class="butCitys" id=""></button>
      </template>
      <button id="search-but">Search</button>
    </form>
  </nav>
  <main>
    <div class="box-section">
      <section id="painel-box">
        <img class="fundo-p" src="assets/images/
bg-today-small.svg" alt="fundo imagem">
        <img class="fundo-g" src="assets/images/
bg-today-large.svg" alt="fundo imagem">
        <div class="painel-info">
          <div class="texto-info">
            <h3 id="painel-city"></h3>
            <p id="painel-week"></p>
          </div>
          <div class="temp-info">
            <img id="painel-img" src="" alt="">
            <p id="painel-temp"></p>
          </div>
        </div>
      </section>
      <section id="info-box">
        <div>
          <p class="p-info-texto">Feels Like</p>
          <p class="p-info-unid" id="feels">00</p>
        </div>
        <div>
          <p class="p-info-texto">Humidity</p>
          <p class="p-info-unid" id="humidity">00</p>
        </div>
        <div>
          <p class="p-info-texto">Wind</p>
          <p class="p-info-unid" id="wind">00</p>
        </div>
        <div>
          <p class="p-info-texto">Precipitation</p>
          <p class="p-info-unid" id="precipitation">00</p>
        </div>
      </section>
      <section id="daily-box">
        <h3>
          Daily forecast
        </h3>
        <div class="div-daily">
          <template id="daily-templete">
            <div class="week-days-info">
              <p id="sigla-semanal">
              </p>
              <img src="#" alt="#">
              <p class="day-max"></p>
              <p class="day-min"></p>
            </div>
          </template>
        </div>
      </section>
    </div>

    <aside>
      <div class="nav-select">
        <h3>Hourly forecast</h3>
        <select id="hourly-select">
          <template id="opt-hourly">
            <option class="opts" value=""></option>
          </template>
        </select>
      </div>
      <div class="box-hourly">
        <template id="hourly-templete">
          <div class="div-hourly">
            <div class="div-img-hourly">
              <img src="" alt="">
              <p id="hour-hourly"></p>
            </div>
            <p id="temp-hourly"></p>
          </div>
        </template>
      </div>
    </aside>
  </main>
  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by
      <a href="https://github.com/JulioSeraf" target="_blank">Julio Serafim</a>.
  </footer>
  </p>


  <script src="js/script.js"></script>
</body>

</html>
